; ============================================================
; 格丽思质量管理工作台 · 企业微信推送配置
; ------------------------------------------------------------
; 填好下面三项，工作台里所有流转 / 审批通知就会同时推到企业微信。
; 不填也没关系：站内「消息中心」照常工作，不会报错。
;
; 改完保存 → 重新双击「启动服务.bat」生效。
; ============================================================

[app]
; 企业ID：企业微信管理后台 → 我的企业 → 企业信息 → 最下面「企业ID」
corpid =

; 应用Secret：管理后台 → 应用管理 → 自建 → 点进你的应用 → Secret 那一行的「查看」
; （点查看后，企业微信会给你发一条消息，里面就是 Secret）
secret =

; AgentId：和 Secret 在同一个应用详情页，是一串数字，例如 1000002
agentid =


[map]
; ------------------------------------------------------------
; 姓名 → 企业微信账号 对照表
;
; 左边写【工作台里显示的名字】（和账号管理里的一致）
; 右边写【企业微信账号 userid】
;
; userid 在哪看：管理后台 → 通讯录 → 点开某个人 → 「账号」那一栏
; ------------------------------------------------------------
; 例子（把下面几行前的分号去掉，换成你自己的）：
;
; 张三 = zhangsan
; 李四 = lisi
; 王五 = wangwu
; 生产部领导 = shengchan_boss
; 品质部领导 = pinzhi_boss


[option]
; 姓名没在上面配对照表时怎么办：
;   all  = 兜底发给全员（@all），保证消息不漏（默认）
;   skip = 跳过，只留站内消息，微信不收
unmapped = all
