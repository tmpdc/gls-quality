; ============================================================
; 格丽思质量管理工作台 · 访问口令
; ------------------------------------------------------------
; 【什么时候要填】
;   只在【公网 / 外网】访问时才需要填。填了以后：
;     - 网页本身照常打开
;     - 但所有数据接口都要求先输口令，别人拿到链接也读不到、改不了你们的数据
;
;   内网（公司局域网 http://192.168.1.16:8686/）可以留空，大家直接就能用。
;
; 【怎么填】
;   推荐：双击「设置访问口令.bat」，按提示输入就行（会问你口令、自动重启服务）。
;   手工填也行：把下面 password 后面写上口令，保存后重启服务。
;
; 【员工怎么用】
;   第一次打开网页时，右下角绿色齿轮 → 填这个口令 → 保存并重连。
;   之后令牌存在自己浏览器里，expire_hours 小时内不用再输。
;
; 【想临时关掉】
;   双击「设置访问口令.bat」选 2，或把下面 password 后面清空，重启服务即可。
;
; 【提醒】
;   工作台的角色权限目前是界面级的 —— 真正拦住数据的是这一层口令。
;   所以这条口令是整个系统的总闸，宁可长一点、乱一点，别用 123456 这种。
; ============================================================

[auth]
; 留空 = 不校验（内网默认）；填了 = 所有数据接口都要口令
password =

; 员工输对一次后，多久内不用再输（小时）
expire_hours = 12
